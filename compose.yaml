services:
  app:
    build: .
    container_name: benjaminkley-app
    ports:
      - "8000:8000"
    volumes:
      - type: bind
        source: .
        target: /app
      - type: bind
        source: ./ai_models
        target: /app/ai_models
        read_only: true
      - type: volume
        source: staticfiles
        target: /app/staticfiles
      - type: bind
        source: ./media
        target: /app/media
    env_file: .env
    environment:
      - PORT=8000
    networks:
      - app-network
    dns:
      - 8.8.8.8
    command: ["/app/docker-entrypoint.sh", "web"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/admin/login/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  celery:
    build: .
    container_name: benjaminkley-celery
    volumes:
      - .:/app
      - ./ai_models:/app/ai_models:ro
      - ./media:/app/media
    env_file: .env
    networks:
      - app-network
    dns:
      - 8.8.8.8
    command: ["/app/docker-entrypoint.sh", "worker"]

  celery-beat:
    build: .
    container_name: benjaminkley-celery-beat
    volumes:
      - .:/app
    env_file: .env
    networks:
      - app-network
    dns:
      - 8.8.8.8
    command: ["/app/docker-entrypoint.sh", "beat"]

  nginx:
    image: nginx:1.25
    container_name: benjaminkley-nginx
    ports:
      - "8080:80"
    volumes:
      # THIS IS THE FINAL FIX:
      # Mounts our site-specific config file into the correct directory.
      - type: bind
        source: ./benjaminkley.conf
        target: /etc/nginx/conf.d/default.conf
        read_only: true
      - type: volume
        source: staticfiles
        target: /app/staticfiles
        read_only: true
      - type: bind
        source: ./media
        target: /app/media
        read_only: true
    depends_on:
      app:
        condition: service_healthy
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  staticfiles: {}