services:
  # --- THE FIX ---
  # The 'db' and 'redis' services have been completely REMOVED.
  # Your app will connect to the remote Railway services defined in your .env file.

  app:
    build: .
    container_name: benjaminkley-app
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - staticfiles:/app/staticfiles
      - media_volume:/app/media
    env_file: .env
    environment:
      - PORT=8000
    networks:
      - app-network
    command: ["/app/docker-entrypoint.sh", "web"]
    # The 'depends_on' key is removed because the local db/redis containers are gone.

  celery:
    build: .
    container_name: benjaminkley-celery
    volumes:
      - .:/app
      - media_volume:/app/media
    env_file: .env
    networks:
      - app-network
    command: ["/app/docker-entrypoint.sh", "worker"]

  celery-beat:
    build: .
    container_name: benjaminkley-celery-beat
    volumes:
      - .:/app
    env_file: .env
    networks:
      - app-network
    command: ["/app/docker-entrypoint.sh", "beat"]

  nginx:
    image: nginx:1.25
    container_name: benjaminkley-nginx
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - staticfiles:/app/staticfiles:ro
      - media_volume:/app/media:ro
    depends_on:
      app:
        condition: service_started
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  # These volumes are still needed for static and media files if you don't use S3
  # It's safe to leave them here.
  postgres_data:
  staticfiles:
  media_volume: