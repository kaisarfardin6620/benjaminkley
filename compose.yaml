services:
  redis:
    image: "redis:7-alpine"
    container_name: benjaminkley-redis
    network_mode: "host"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgbouncer:
    image: "bitnami/pgbouncer:1"
    container_name: benjaminkley-pgbouncer
    network_mode: "host"
    restart: unless-stopped
    env_file: .env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 6432 -U ${PGBOUNCER_DATABASE_USERNAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    network_mode: "host"
    volumes:
      - type: bind
        source: .
        target: /app
      - type: bind
        source: ./ai_models
        target: /app/ai_models
        read_only: true
      - type: bind
        source: ./staticfiles
        target: /app/staticfiles
      - type: bind
        source: ./media
        target: /app/media
    env_file: .env
    environment:
      - PORT=8000
      - TZ=UTC
      - MPLCONFIGDIR=/app/.cache/matplotlib
    command: ["/app/docker-entrypoint.sh", "web"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/admin/login/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    depends_on:
      redis:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy

  celery-worker:
    build: .
    container_name: benjaminkley-celery-worker
    network_mode: "host"
    command: ["/app/docker-entrypoint.sh", "celery-worker"]
    restart: unless-stopped
    volumes:
      - type: bind
        source: .
        target: /app
      - type: bind
        source: ./ai_models
        target: /app/ai_models
        read_only: true
      - type: bind
        source: ./media
        target: /app/media
    env_file: .env
    environment:
      - TZ=UTC
      - MPLCONFIGDIR=/app/.cache/matplotlib
    depends_on:
      redis:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy
      app:
        condition: service_healthy

  celery-beat:
    build: .
    container_name: benjaminkley-celery-beat
    network_mode: "host"
    command: ["/app/docker-entrypoint.sh", "celery-beat"]
    restart: unless-stopped
    volumes:
      - type: bind
        source: .
        target: /app
      - type: bind
        source: ./ai_models
        target: /app/ai_models
        read_only: true
    env_file: .env
    environment:
      - TZ=UTC
    depends_on:
      redis:
        condition: service_healthy
      app:
        condition: service_started
