services:
  # NEW: Redis service for Celery message brokering
  redis:
    image: "redis:7-alpine"
    container_name: benjaminkley-redis
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # UPDATED: Django App now depends on Redis
  app:
    build: .
    container_name: benjaminkley-app
    ports:
      - "8000:8000"
    volumes:
      - type: bind
        source: .
        target: /app
      - type: bind
        source: ./ai_models
        target: /app/ai_models
        read_only: true
      - type: volume
        source: staticfiles
        target: /app/staticfiles
      - type: bind
        source: ./media
        target: /app/media
    env_file: .env
    environment:
      - PORT=8000
      - TZ=UTC
      - MPLCONFIGDIR=/app/.cache/matplotlib
    networks:
      - app-network
    dns:
      - 8.8.8.8
    # MODIFIED: Changed command to be explicit
    command: ["/app/docker-entrypoint.sh", "web"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/admin/login/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    # ADDED: Depends on Redis being healthy before starting
    depends_on:
      redis:
        condition: service_healthy

  # NEW: Celery worker service for background tasks
  celery-worker:
    build: .
    container_name: benjaminkley-celery-worker
    command: ["/app/docker-entrypoint.sh", "celery-worker"]
    volumes:
      - type: bind
        source: .
        target: /app
      - type: bind
        source: ./ai_models
        target: /app/ai_models
        read_only: true
    env_file: .env
    environment:
      - TZ=UTC
      - MPLCONFIGDIR=/app/.cache/matplotlib
    networks:
      - app-network
    # ADDED: Depends on both Redis and the main app code/migrations
    depends_on:
      redis:
        condition: service_healthy
      app:
        condition: service_started # or service_healthy if you have a separate db wait

  # UNCHANGED: Nginx service
  nginx:
    image: nginx:1.25
    container_name: benjaminkley-nginx
    ports:
      - "8080:80"
    volumes:
      - type: bind
        source: ./benjaminkley.conf
        target: /etc/nginx/conf.d/default.conf
        read_only: true
      - type: volume
        source: staticfiles
        target: /app/staticfiles
        read_only: true
      - type: bind
        source: ./media
        target: /app/media
        read_only: true
    depends_on:
      app:
        condition: service_healthy
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  staticfiles: {}