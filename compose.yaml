services:
  app:
    build: .
    container_name: benjaminkley-app
    ports:
      - "8000:8000"
    volumes:
      - type: bind
        source: .
        target: /app
      - type: bind
        source: ./ai_models
        target: /app/ai_models
        read_only: true
      - type: volume
        source: staticfiles
        target: /app/staticfiles
      - type: bind
        source: ./media
        target: /app/media
    env_file: .env
    environment:
      - PORT=8000
      - TZ=UTC
      - MPLCONFIGDIR=/app/.cache/matplotlib
    networks:
      - app-network
    dns:
      - 8.8.8.8
    command: ["/app/docker-entrypoint.sh", "web"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/admin/login/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  nginx:
    image: nginx:1.25
    container_name: benjaminkley-nginx
    ports:
      - "8080:80"
    volumes:
      - type: bind
        source: ./benjaminkley.conf
        target: /etc/nginx/conf.d/default.conf
        read_only: true
      - type: volume
        source: staticfiles
        target: /app/staticfiles
        read_only: true
      - type: bind
        source: ./media
        target: /app/media
        read_only: true
    depends_on:
      app:
        condition: service_healthy
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  staticfiles: {}