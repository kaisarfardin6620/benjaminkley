services:
  redis:
    image: "redis:7-alpine"
    container_name: benjaminkley-redis
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: benjaminkley-app
    volumes:
      - type: bind
        source: .
        target: /app
      - type: bind
        source: ./ai_models
        target: /app/ai_models
        read_only: true
      - type: volume
        source: staticfiles
        target: /app/staticfiles
      - type: bind
        source: ./media
        target: /app/media
    env_file: .env
    environment:
      - PORT=8000
      - TZ=UTC
      - MPLCONFIGDIR=/app/.cache/matplotlib
    networks:
      - app-network
    dns:
      - 8.8.8.8
    command: ["/app/docker-entrypoint.sh", "web"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/admin/login/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    depends_on:
      redis:
        condition: service_healthy

  celery-worker:
    build: .
    container_name: benjaminkley-celery-worker
    command: ["/app/docker-entrypoint.sh", "celery-worker"]
    volumes:
      - type: bind
        source: .
        target: /app
      - type: bind
        source: ./ai_models
        target: /app/ai_models
        read_only: true
    env_file: .env
    environment:
      - TZ=UTC
      - MPLCONFIGDIR=/app/.cache/matplotlib
    networks:
      - app-network
    depends_on:
      redis:
        condition: service_healthy
      app:
        condition: service_started

  dashboard-app:
    image: node:18-alpine
    container_name: benjaminkley-dashboard
    working_dir: /app
    volumes:
      - ./path/to/your/dashboard:/app
    command: npm start
    networks:
      - app-network
    ports:
      - "3000:3000"

  nginx:
    image: nginx:1.25
    container_name: benjaminkley-nginx
    ports:
      - "8080:80"
    volumes:
      - type: bind
        source: ./benjaminkley.conf
        target: /etc/nginx/conf.d/default.conf
        read_only: true
      - type: volume
        source: staticfiles
        target: /app/staticfiles
        read_only: true
      - type: bind
        source: ./media
        target: /app/media
        read_only: true
    depends_on:
      app:
        condition: service_healthy
      dashboard-app:
        condition: service_started
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  staticfiles: {}