services:
  # Redis service for Celery message brokering
  redis:
    image: "redis:7-alpine"
    container_name: benjaminkley-redis
    network_mode: "host"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Django App
  app:
    build: .
    container_name: benjaminkley-app
    network_mode: "host"
    volumes:
      - type: bind
        source: .
        target: /app
      - type: bind
        source: ./ai_models
        target: /app/ai_models
        read_only: true
      # CHANGED: Bind mount allows Host Nginx to read these files
      - type: bind
        source: ./staticfiles
        target: /app/staticfiles
      # CHANGED: Bind mount allows persistence on Host
      - type: bind
        source: ./media
        target: /app/media
    env_file: .env
    environment:
      - PORT=8000
      - TZ=UTC
      - MPLCONFIGDIR=/app/.cache/matplotlib
    command: ["/app/docker-entrypoint.sh", "web"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/admin/login/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    depends_on:
      redis:
        condition: service_healthy

  # Celery worker service for background tasks
  celery-worker:
    build: .
    container_name: benjaminkley-celery-worker
    network_mode: "host"
    command: ["/app/docker-entrypoint.sh", "celery-worker"]
    volumes:
      - type: bind
        source: .
        target: /app
      - type: bind
        source: ./ai_models
        target: /app/ai_models
        read_only: true
      - type: bind
        source: ./media
        target: /app/media
    env_file: .env
    environment:
      - TZ=UTC
      - MPLCONFIGDIR=/app/.cache/matplotlib
    depends_on:
      redis:
        condition: service_healthy
      app:
        condition: service_started
