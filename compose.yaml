# compose.yaml (FINAL, DEFINITIVE VERSION)
services:
  db:
    image: "postgres:15-alpine"
    container_name: benjaminkley-db
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    env_file: .env
    networks:
      - app-network

  redis:
    image: "redis:alpine"
    container_name: benjaminkley-redis
    networks:
      - app-network

  app:
    build: .
    container_name: benjaminkley-app
    ports:
      - "8001:8000"
    volumes:
      - staticfiles:/app/staticfiles
      # --- START OF FIX ---
      # Mount the new shared media volume
      - media_volume:/app/media
      # --- END OF FIX ---
    env_file: .env
    environment:
      - PORT=8000
    networks:
      - app-network
    command: ["/app/docker-entrypoint.sh", "web"]
    depends_on:
      - db
      - redis

  celery:
    build: .
    container_name: benjaminkley-celery
    volumes:
      # --- START OF FIX ---
      # Mount the SAME shared media volume
      - media_volume:/app/media
      # --- END OF FIX ---
    env_file: .env
    networks:
      - app-network
    command: ["/app/docker-entrypoint.sh", "worker"]
    depends_on:
      - db
      - redis

  celery-beat:
    build: .
    container_name: benjaminkley-celery-beat
    env_file: .env
    networks:
      - app-network
    command: ["/app/docker-entrypoint.sh", "beat"]
    depends_on:
      - db
      - redis

  nginx:
    image: nginx:1.25
    container_name: benjaminkley-nginx
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - staticfiles:/app/staticfiles:ro
      # --- START OF FIX ---
      # Nginx also needs to see the media files to serve them
      - media_volume:/app/media:ro
      # --- END OF FIX ---
    depends_on:
      app:
        condition: service_started
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  postgres_data:
  staticfiles:
  # --- START OF FIX ---
  # Define the new shared volume
  media_volume:
  # --- END OF FIX ---