services:
  app:
    build: .
    container_name: benjaminkley-app
    ports:
      - "8000:8000"
    volumes:
      # Use named volumes for persistent data and outputs only
      - staticfiles:/app/staticfiles
      - media_volume:/app/media
      - scans_outputs_volume:/app/scans/outputs
    env_file: .env
    environment:
      - PORT=8000
      - USE_S3_STORAGE=True
    networks:
      - app-network
    dns:
      - 8.8.8.8
    command: ["/app/docker-entrypoint.sh", "web"]

  celery:
    build: .
    container_name: benjaminkley-celery
    volumes:
      - media_volume:/app/media
      - scans_outputs_volume:/app/scans/outputs
    env_file: .env
    environment:
      - USE_S3_STORAGE=True
    networks:
      - app-network
    dns:
      - 8.8.8.8
    command: ["/app/docker-entrypoint.sh", "worker"]

  celery-beat:
    build: .
    container_name: benjaminkley-celery-beat
    volumes:
      - scans_outputs_volume:/app/scans/outputs
    env_file: .env
    networks:
      - app-network
    dns:
      - 8.8.8.8
    command: ["/app/docker-entrypoint.sh", "beat"]

  nginx:
    image: nginx:1.25
    container_name: benjaminkley-nginx
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - staticfiles:/app/staticfiles:ro
      - media_volume:/app/media:ro
      - scans_outputs_volume:/app/scans/outputs:ro
    depends_on:
      app:
        condition: service_started
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  staticfiles:
  media_volume:
  scans_outputs_volume:
